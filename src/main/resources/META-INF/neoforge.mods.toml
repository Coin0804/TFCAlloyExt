modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "tfc_alloy_ext.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tfc"
type = "required"
versionRange = "[4.1.0,5)"
ordering = "NONE"
side = "BOTH"

# 群峦扩展 API — required（2026-08-10：注册工作流迁入 Lib）
[[dependencies.${mod_id}]]
modId = "tfc_ext_api"
type = "required"
versionRange = "[0.1.0-beta,5)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersiveengineering"
type = "optional"
versionRange = "[12.0,13)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "productivemetalworks"
type = "optional"
versionRange = "[1.0,2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tfc_ie_addon"
type = "optional"
versionRange = "[2.1,3)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "firmalife"
type = "optional"
versionRange = "[3.0,4)"
ordering = "AFTER"
side = "BOTH"
