plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.named('processResources', ProcessResources).configure {
    filesMatching('**/*.toml') {
        expand(project.properties)
    }
    filesMatching('**/*.mcmeta') {
        expand(project.properties)
    }
}

base {
    archivesName = "${mod_id}-neoforge-${mod_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

dependencies {
    // 群峦扩展 API — compileOnly（MetalRegistration/FluidRegistrationHelper，required 依赖）
    compileOnly fileTree('../../mods') { include '*tfc_ext_api-*.jar' }
    // TFC — compileOnly (Mixin 目标 + MoltenFluid 基类)
    compileOnly fileTree('../../mods') { include '*TerraFirmaCraft-NeoForge-*.jar' }
    // Productive Metalworks — compileOnly (Mixin 目标, optional)；fileTree glob 展开 mods 目录，mod 升级无需改此处
    compileOnly fileTree('../../mods') { include '*productivemetalworks-*.jar' }
    // Immersive Engineering — compileOnly (Mixin 目标, optional)
    compileOnly fileTree('../../mods') { include '*ImmersiveEngineering-*.jar' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
